[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dubber"
version = "0.1.0"
description = "Production grade AI video dubbing CLI for YouTube videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.3",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "sacremoses>=0.1.1",
    "edge-tts>=6.1.12",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "librosa>=0.10.2",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "imageio-ffmpeg>=0.5.1",
    "pytest>=8.0.0"
]

[project.scripts]
dubber = "dubber.cli:main"
